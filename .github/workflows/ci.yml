name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Check pull request branch flow
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-branch-flow.mjs

  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check native input before packaging
        run: npm run test:computer-use
      - run: npm run voice:build
      - run: npm run voice:test-native
      - run: npm run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node native/whisper-helper/tests/check.mjs "release/win-unpacked/resources/voice/bin/cpu/computercat-whisper.exe"
      - name: Smoke test the packaged app
        run: npx playwright test
        env:
          COMPUTERCAT_PACKAGED_EXECUTABLE: release/win-unpacked/Computer Cat.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-desktop-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
