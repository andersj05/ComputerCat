appId: com.andersj05.computercat
productName: Computer Cat
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/voice
    to: voice
    filter:
      - bin/cpu/*.exe
      - bin/cpu-avx2/*.exe
      - licenses/*
      - THIRD_PARTY_NOTICES.md
      - models.json
  - from: LICENSE
    to: LICENSE
  - from: assets/computer_cat.png
    to: computer_cat.png
beforePack: scripts/check-voice-package.cjs
asar: true
npmRebuild: true
win:
  icon: assets/computer_cat.png
  target: nsis
  artifactName: ComputerCat-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
